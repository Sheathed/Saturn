output: dist/
releases:
  # Production builds keep the existing release names used by CI.
  - name: linux
    jobs:
      - name: release-release-linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            flavor: stable
      - name: release-release-linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            flavor: stable
      - name: release-release-linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            flavor: stable
  - name: windows
    jobs:
      - name: release-release-windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            flavor: stable
  - name: macos
    jobs:
      - name: release-release-mac-dmg
        package:
          platform: macos
          target: dmg
          build_args:
            flavor: stable

  - name: linux-dev
    jobs:
      - name: release-dev-linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            flavor: dev
          hooks:
            pre:
              - mkdir -p "$(dirname "$BUILD_OUTPUT_DIRECTORY")" && rm -rf "$BUILD_OUTPUT_DIRECTORY" && ln -sfn "$(pwd)/build/linux/x64/dev/release/bundle" "$BUILD_OUTPUT_DIRECTORY"
      - name: release-dev-linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            flavor: dev
          hooks:
            pre:
              - mkdir -p "$(dirname "$BUILD_OUTPUT_DIRECTORY")" && rm -rf "$BUILD_OUTPUT_DIRECTORY" && ln -sfn "$(pwd)/build/linux/x64/dev/release/bundle" "$BUILD_OUTPUT_DIRECTORY"
      - name: release-dev-linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            flavor: dev
          hooks:
            pre:
              - mkdir -p "$(dirname "$BUILD_OUTPUT_DIRECTORY")" && rm -rf "$BUILD_OUTPUT_DIRECTORY" && ln -sfn "$(pwd)/build/linux/x64/dev/release/bundle" "$BUILD_OUTPUT_DIRECTORY"
  - name: linux-canary
    jobs:
      - name: release-canary-linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            flavor: canary
          hooks:
            pre:
              - mkdir -p "$(dirname "$BUILD_OUTPUT_DIRECTORY")" && rm -rf "$BUILD_OUTPUT_DIRECTORY" && ln -sfn "$(pwd)/build/linux/x64/canary/release/bundle" "$BUILD_OUTPUT_DIRECTORY"
      - name: release-canary-linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            flavor: canary
          hooks:
            pre:
              - mkdir -p "$(dirname "$BUILD_OUTPUT_DIRECTORY")" && rm -rf "$BUILD_OUTPUT_DIRECTORY" && ln -sfn "$(pwd)/build/linux/x64/canary/release/bundle" "$BUILD_OUTPUT_DIRECTORY"
      - name: release-canary-linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            flavor: canary
          hooks:
            pre:
              - mkdir -p "$(dirname "$BUILD_OUTPUT_DIRECTORY")" && rm -rf "$BUILD_OUTPUT_DIRECTORY" && ln -sfn "$(pwd)/build/linux/x64/canary/release/bundle" "$BUILD_OUTPUT_DIRECTORY"

  - name: windows-dev
    jobs:
      - name: release-dev-windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            flavor: dev
  - name: windows-canary
    jobs:
      - name: release-canary-windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            flavor: canary

  - name: macos-dev
    jobs:
      - name: release-dev-mac-dmg
        package:
          platform: macos
          target: dmg
          build_args:
            flavor: dev
  - name: macos-canary
    jobs:
      - name: release-canary-mac-dmg
        package:
          platform: macos
          target: dmg
          build_args:
            flavor: canary

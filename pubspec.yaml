# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/cover.jpg
    - assets/cover_thumb.jpg
    - assets/icon.png
    - assets/banner.png
    - assets/favorites_thumb.jpg
    - assets/browse_icon.png
    - assets/skip-previous.ico
    - assets/play.ico
    - assets/pause.ico
    - assets/skip-next.ico
    - assets/icon-taskbar-white.png
    - assets/icon-taskbar-white.ico
    - assets/neurokaraoke_icon.png
    - assets/banner-dev.png
    - assets/banner-canary.png
    - assets/icon-dev.png
    - assets/icon-canary.png
    - assets/ytmusicapi_locales/


  fonts:
    - family: MabryPro
      fonts:
        - asset: assets/fonts/MabryPro.otf
        - asset: assets/fonts/MabryProItalic.otf
          style: italic
        - asset: assets/fonts/MabryProBold.otf
          weight: 700
        - asset: assets/fonts/MabryProBlack.otf
          weight: 900
